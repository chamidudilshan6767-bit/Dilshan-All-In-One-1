<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Status Saver</title>
    <style>
        body { font-family: sans-serif; background: #0b0e14; color: white; padding: 20px; text-align: center; }
        .instructions { background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; text-align: left; }
    </style>
</head>
<body>
    <h2>WhatsApp Status Saver Guide</h2>
    <div class="instructions">
        <p>1. Open WhatsApp & View Statuses.</p>
        <p>2. Open File Manager on Android.</p>
        <p>3. Go to <b>Android > media > com.whatsapp > WhatsApp > Media > .Statuses</b></p>
        <p>4. Copy media files to standard Gallery folder.</p>
    </div>
</body>
</html>
