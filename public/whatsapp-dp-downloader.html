<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp DP Downloader</title>
    <style>
        body { font-family: sans-serif; background: #0b0e14; color: white; padding: 20px; text-align: center; }
        input, button { padding: 10px; margin: 10px; width: 80%; border-radius: 6px; border: 1px solid #30363d; }
        button { background: #238636; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <h2>WhatsApp DP Downloader</h2>
    <p>Enter WhatsApp Phone Number with Country Code:</p>
    <input type="text" id="phoneNum" placeholder="e.g. 94712345678">
    <button onclick="fetchDP()">Get Profile Picture</button>

    <script>
        function fetchDP() {
            const num = document.getElementById('phoneNum').value;
            if(!num) return alert('Please enter phone number!');
            alert('Opening WhatsApp direct link to fetch profile picture info...');
            window.open(`https://wa.me/${num}`, '_blank');
        }
    </script>
</body>
</html>
