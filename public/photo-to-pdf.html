<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo to PDF Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px 15px; display: flex; justify-content: center; }
        .box { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; width: 100%; max-width: 450px; text-align: center; }
        a { color: #58a6ff; text-decoration: none; font-size: 13px; }
        input[type="file"] { margin: 15px 0; color: #8b949e; }
        button { width: 100%; padding: 10px; background: #1f6feb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <a href="index.html">← Back to Home</a>
        <h2 style="color:#fff;">PHOTO TO PDF CONVERTER</h2>
        <input type="file" id="imgInput" accept="image/*" multiple><br>
        <button onclick="convert()">CONVERT & DOWNLOAD PDF</button>
    </div>

    <script>
        async function convert() {
            const files = document.getElementById('imgInput').files;
            if (files.length === 0) return alert('Please select images first!');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.readAsDataURL(files[i]);
                await new Promise(res => {
                    reader.onload = (e) => {
                        if (i > 0) doc.addPage();
                        doc.addImage(e.target.result, 'JPEG', 10, 10, 180, 160);
                        res();
                    }
                });
            }
            doc.save("converted.pdf");
        }
    </script>
</body>
</html>
