<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamidu's Admin App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }
        .admin-card {
            width: 100%;
            max-width: 450px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 20px; }
        .stats-box {
            background: #0d1117; border: 1px solid #30363d;
            padding: 15px; border-radius: 8px; text-align: center; margin: 15px 0;
        }
        .stats-num { font-size: 32px; font-weight: bold; color: #58a6ff; }
        input, button, select, textarea {
            width: 100%; padding: 10px; margin-top: 10px;
            border-radius: 6px; border: 1px solid #30363d;
            background: #0d1117; color: white; box-sizing: border-box; outline: none;
        }
        button {
            background: #238636; font-weight: bold; cursor: pointer; border: none;
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>CHAMIDU'S ADMIN APP</h2>
        
        <div id="authSection">
            <h3 style="font-size:15px; text-align:center; color:#8b949e;">Enter Admin Password</h3>
            <input type="password" id="adminPass" placeholder="Password...">
            <button onclick="checkPass()">LOGIN TO LIVE STATS</button>
        </div>

        <div id="dashSection" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; color:#8b949e;">Live Dashboard (Auto 10s)</span>
                <button onclick="location.reload()" style="width:auto; padding:5px 12px; font-size:12px; background:#1f6feb;">Refresh</button>
            </div>
            
            <div class="stats-box">
                <span style="font-size:12px; color:#8b949e;">TOTAL MAIN APP DOWNLOADS</span>
                <div class="stats-num">1</div>
            </div>

            <h3 style="font-size:15px; color:#ffffff; margin-bottom:5px;">PUBLISH MEDIA / NOTICE / LINKS</h3>
            <select>
                <option>Text Notice Only</option>
                <option>Photo / File Attachment</option>
            </select>
            <textarea rows="3" placeholder="Type caption or description..."></textarea>
            
            <p style="margin:10px 0 0 0; font-size:12px; color:#8b949e;">Add Action Button (Optional):</p>
            <input type="text" placeholder="Paste URL (e.g. https://t.me/Dilshan7878)...">
            <input type="text" placeholder="Button Name (e.g. Join Telegram)...">
            
            <button style="background:#1f6feb;">PUBLISH TO MAIN FEED</button>

            <h3 style="font-size:15px; color:#ffffff; margin-top:20px;">MANAGE PUBLISHED POSTS</h3>
            <p style="font-size:13px; color:#8b949e; text-align:center;">No posts published yet.</p>
        </div>
    </div>

    <script>
        const SECRET = "#chAmidu_diLshan*600008*#";
        function checkPass() {
            const pass = document.getElementById('adminPass').value;
            if (pass === SECRET) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('dashSection').style.display = 'block';
            } else {
                alert('Invalid Password!');
            }
        }
    </script>
</body>
</html>
