<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px 15px; display: flex; justify-content: center; }
        .box { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; width: 100%; max-width: 450px; text-align: center; }
        a { color: #58a6ff; text-decoration: none; font-size: 13px; }
        input { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 10px; margin-top: 15px; background: #1f6feb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <a href="index.html">← Back to Home</a>
        <h2 style="color:#fff;">PASSWORD GENERATOR</h2>
        <input type="text" id="prefix" placeholder="Prefix (e.g. Dilshan#)">
        <input type="text" id="passResult" placeholder="Generated Password" readonly style="color:#58a6ff; font-weight:bold;">
        <button onclick="genPass()">GENERATE PASSWORD</button>
    </div>

    <script>
        function genPass() {
            const prefix = document.getElementById('prefix').value;
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
            let res = "";
            for (let i = 0; i < 10; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passResult').value = prefix + res;
        }
    </script>
</body>
</html>
