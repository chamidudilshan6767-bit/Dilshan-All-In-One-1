<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Generator</title>
    <style>
        body { font-family: sans-serif; background: #0b0e14; color: white; padding: 20px; text-align: center; }
        input, button { padding: 10px; margin: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <h2>Password Generator</h2>
    <button onclick="genPass()">Generate Password</button>
    <h3 id="passOut"></h3>

    <script>
        function genPass() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
            let res = "";
            for (let i = 0; i < 14; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passOut').innerText = res;
        }
    </script>
</body>
</html>
